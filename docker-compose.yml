version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: internscope-postgres
    restart: always
    environment:
      POSTGRES_DB: internscope
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: internscope_secure_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d internscope"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: internscope-api
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:internscope_secure_password@db:5432/internscope
      SECRET_KEY: internscope-production-jwt-secret-replace-me-with-random-hex
      CORS_ORIGINS: '["http://localhost:5173", "http://localhost:3000", "http://localhost"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - upload_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: internscope-web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  upload_data:
